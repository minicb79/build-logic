[versions]
kotlin = "2.3.0"
spotless = "6.25.0"
springBoot = "4.0.5"
dependencyManagement = "1.1.7"
otelBom = "1.41.0"
otelLogbackAppender = "2.21.0-alpha"
wiremock = "3.12.0"
archunitGradlePlugin = "2.9.5"
snakeyaml = "2.7"
protobufGradlePlugin = "0.9.4"
dgsCodegen = "8.7.0"
grpc = "1.68.1"
protobuf = "3.25.5"

[libraries]
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { group = "org.jetbrains.kotlin", name = "kotlin-allopen", version.ref = "kotlin" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
springBoot-gradlePlugin = { group = "org.springframework.boot", name = "spring-boot-gradle-plugin", version.ref = "springBoot" }
dependencyManagement-gradlePlugin = { group = "io.spring.gradle", name = "dependency-management-plugin", version.ref = "dependencyManagement" }
opentelemetry-bom = { group = "io.opentelemetry", name = "opentelemetry-bom", version.ref = "otelBom" }
opentelemetry-api = { group = "io.opentelemetry", name = "opentelemetry-api" }
opentelemetry-sdk = { group = "io.opentelemetry", name = "opentelemetry-sdk" }
opentelemetry-logback-appender = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-logback-appender-1.0", version.ref = "otelLogbackAppender" }
wiremock-standalone = { group = "org.wiremock", name = "wiremock-standalone", version.ref = "wiremock" }
archunit-gradlePlugin = { group = "com.societegenerale.commons", name = "arch-unit-gradle-plugin", version.ref = "archunitGradlePlugin" }
snakeyaml = {module = "org.yaml:snakeyaml", version.ref = "snakeyaml"}
protobuf-gradlePlugin = { group = "com.google.protobuf", name = "protobuf-gradle-plugin", version.ref = "protobufGradlePlugin" }
dgs-codegen-gradlePlugin = { group = "com.netflix.graphql.dgs.codegen", name = "graphql-dgs-codegen-gradle", version.ref = "dgsCodegen" }

